# Smart Labeler — Flask Server only — NRP Kubernetes manifests
#
# Deploy to your namespace:  kubectl apply -f k8s/server-deployment.yaml -n <your-namespace>
#
# Before applying:
#   1. Replace <YOUR_NAMESPACE>  with your NRP namespace (e.g. sailab)
#   2. Replace <YOUR_REGISTRY>   with your image registry (e.g. brijeshnanda)
#   3. Replace <IMAGE_TAG>       with your image tag
#   4. Set DB_HOST / DB_PASSWORD to point at your existing database
#   5. base64-encode DB_PASSWORD: echo -n 'pw' | base64

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-labeler-server-config
data:
  # URL of the Remix frontend (used for CORS / redirect after OAuth)
  FRONT_URL: "https://smart-labeler-sailab.nrp-nautilus.io"
  COOKIE_DOMAIN: "nrp-nautilus.io"
  COOKIE_SECURE: "true"

  SAM3_ENDPOINT: "https://sam3-sailab.nrp-nautilus.io"
  INSID3_ENDPOINT: "http://insid3-service"
  INSID3_TIMEOUT_SECONDS: "300"
  TAPIS_BASE_URL: "https://icicleai.tapis.io"
  PATRA_BASE_NEW: "https://patrabackend.pods.icicleai.tapis.io"

  # Point at your existing PostgreSQL instance
  DB_HOST: "smartlabelerdb.pods.icicleai.tapis.io"
  DB_PORT: "443"
  DB_NAME: "postgres"
  DB_USER: "smartlabelerdb"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"

  # Job containers
  SMART_LABELER_CLASS_SUPPORT_IMAGE: "https://icicleai.tapis.io/v3/files/postits/redeem/90da90d8-7a38-4f6a-93b4-b263710a1887-010"
  SMART_LABELER_PROPOSAL_GENERATION_IMAGE: "https://icicleai.tapis.io/v3/files/postits/redeem/3f6e5208-2a08-4b7a-b885-035fbe8a5390-010"
  SMART_LABELER_CLASSIFICATION_IMAGE: "https://icicleai.tapis.io/v3/files/postits/redeem/2f415522-f511-4b45-b9b7-660554df5ef4-010"

---
# ── Secret ────────────────────────────────────────────────────────────────────
# Generate: echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: smart-labeler-server-secret
type: Opaque
stringData:
  DB_PASSWORD: ""   # plain-text — Kubernetes encodes this automatically

---
# ── Flask Server Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-labeler-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-labeler-server
  template:
    metadata:
      labels:
        app: smart-labeler-server
    spec:
      containers:
      - name: smart-labeler-server
        image: brijeshnanda/smart_labeler_backend:v1.0.0
        ports:
        - containerPort: 11112
          name: backend
        envFrom:
        - configMapRef:
            name: smart-labeler-server-config
        - secretRef:
            name: smart-labeler-server-secret
        env:
        # Optional shared key used only for backend-to-INSID3 requests.
        - name: INSID3_API_KEY
          valueFrom:
            secretKeyRef:
              name: insid3-secrets
              key: INSID3_API_KEY
              optional: true
        # readinessProbe:
        #   httpGet:
        #     path: /api/health
        #     port: 11112
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        #   failureThreshold: 5
        # livenessProbe:
        #   httpGet:
        #     path: /api/health
        #     port: 11112
        #   initialDelaySeconds: 60
        #   periodSeconds: 30
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"

---
# ── Flask Server Service ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: smart-labeler-server
spec:
  selector:
    app: smart-labeler-server
  ports:
  - port: 80
    targetPort: 11112
  type: ClusterIP

---
# ── Ingress — Flask API ────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-labeler-server-ingress
  annotations:
    haproxy-ingress-proxy.timeout: "300s"
    haproxy.router.openshift.io/timeout: "300s"
    haproxy-ingress.github.io/proxy-body-size: "160m"
spec:
  ingressClassName: haproxy
  rules:
  - host: smart-labeler-api-sailab.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: smart-labeler-server
            port:
              number: 80
  tls:
  - hosts:
    - smart-labeler-api-sailab.nrp-nautilus.io
