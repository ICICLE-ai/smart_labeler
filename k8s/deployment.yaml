# Smart Labeler — NRP Kubernetes manifests
#
# Deploy to your namespace:  kubectl apply -f k8s/deployment.yaml -n <your-namespace>
#
# Before applying:
#   1. Replace <YOUR_NAMESPACE>  with your NRP namespace (e.g. sailab)
#   2. Replace <YOUR_REGISTRY>   with your image registry (e.g. brijeshnanda)
#   3. Replace <IMAGE_TAG>       with your image tag
#   4. Set DB_HOST / DB_PASSWORD to point at your existing database
#   5. base64-encode DB_PASSWORD: echo -n 'pw' | base64

---
# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-labeler-config
data:
  # Must match the Flask API ingress host below so the browser can reach Flask.
  API_BASE_URL: "https://smart-labeler-api-sailab.nrp-nautilus.io"

  # Redirect target after OAuth2 login; cookie domain shared across both subdomains.
  FRONT_URL: "https://smart-labeler-sailab.nrp-nautilus.io"
  COOKIE_DOMAIN: "nrp-nautilus.io"
  COOKIE_SECURE: "true"

  SAM3_ENDPOINT: "https://sam3-sailab.nrp-nautilus.io"
  # Internal ClusterIP URL from k8s/insid3-deployment.yaml. Keep INSID3 private;
  # browsers call it through the authenticated Smart Labeler backend proxy.
  INSID3_ENDPOINT: "http://insid3-service"
  INSID3_TIMEOUT_SECONDS: "300"
  TAPIS_BASE_URL: "https://icicleai.tapis.io"
  PATRA_BASE_NEW: "https://patrabackend.pods.icicleai.tapis.io"

  # Point at your existing PostgreSQL instance
  DB_HOST: "smartlabelerdb.pods.icicleai.tapis.io"
  DB_PORT: "443"
  DB_NAME: "postgres"
  DB_USER: "smartlabelerdb"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "20"

---
# ── Secret ────────────────────────────────────────────────────────────────────
# Generate: echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: smart-labeler-secret
type: Opaque
stringData:
  DB_PASSWORD: ""   # plain-text — Kubernetes encodes this automatically

---
# ── Smart Labeler Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-labeler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-labeler
  template:
    metadata:
      labels:
        app: smart-labeler
    spec:
      containers:
      - name: smart-labeler
        image: brijeshnanda/smart_labeler:v4
        command: ["/bin/bash", "-c"]
        args:
          - |
            . /root/miniconda3/bin/activate
            conda activate smart_labeler
            cd /smart_labeler/client && npm start &
            cd /smart_labeler/server && python3 flask_server.py
        ports:
        - containerPort: 3000    # Remix frontend
          name: frontend
        - containerPort: 11112   # Flask backend
          name: backend
        envFrom:
        - configMapRef:
            name: smart-labeler-config
        - secretRef:
            name: smart-labeler-secret
        env:
        # Optional shared key used only for backend-to-INSID3 requests.
        - name: INSID3_API_KEY
          valueFrom:
            secretKeyRef:
              name: insid3-secrets
              key: INSID3_API_KEY
              optional: true
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"

---
# ── Smart Labeler Frontend Service ────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: smart-labeler-frontend
spec:
  selector:
    app: smart-labeler
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP

---
# ── Smart Labeler Backend (Flask) Service ─────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: smart-labeler-backend
spec:
  selector:
    app: smart-labeler
  ports:
  - port: 80
    targetPort: 11112
  type: ClusterIP

---
# ── Ingress — Frontend (Remix) ────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-labeler-frontend-ingress
  annotations:
    haproxy-ingress-proxy.timeout: "300s"
    haproxy.router.openshift.io/timeout: "300s"
spec:
  ingressClassName: haproxy
  rules:
  - host: smart-labeler-sailab.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: smart-labeler-frontend
            port:
              number: 80
  tls:
  - hosts:
    - smart-labeler-sailab.nrp-nautilus.io

---
# ── Ingress — Backend (Flask API) ─────────────────────────────────────────────
# API_BASE_URL in the ConfigMap must match this host.
# The browser calls Flask directly, so it needs its own public ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-labeler-backend-ingress
  annotations:
    haproxy-ingress-proxy.timeout: "300s"
    haproxy.router.openshift.io/timeout: "300s"
    haproxy-ingress.github.io/proxy-body-size: "160m"
spec:
  ingressClassName: haproxy
  rules:
  - host: smart-labeler-api-sailab.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: smart-labeler-backend
            port:
              number: 80
  tls:
  - hosts:
    - smart-labeler-api-sailab.nrp-nautilus.io
